    meta: "2024. Capstone writeup, Lehigh CSE."
    pdf: /papers/highlighting-algorithm.pdf
    page: /projects/capstone-search
    abstract: "The sentence-level highlight extractor at the heart of my Lehigh capstone search engine. Given a query and a matched sentence, surface the minimal sub-span that explains the match. Deceptively non-trivial when the query is multi-word, partially stop-worded, or syntactically interleaved with the matched sentence."
    on_resume: false

# Resume layout. Sections render in order; each lists experience ids in order.
# Publications are attached to their research entries in the bullets, so
# include_publications stays false (no standalone heading until something is accepted).
resume:
  include_publications: false
  sections:
    - title: Experience
      ids: [ninth-wave, nybss-swe]
    - title: Research
      ids: [kronos, deployed-learning, jspace-hrm]
    - title: Projects
      ids: [dj-copilot] # dj-rl, compute-cluster, tracklist stay in the bank; swap in for embedded, infra, or audio postings
  # per-id bullet selection for the one-page resume: an int = first N bullets,
  # a list = those 0-based indices, omitted = all bullets.
  bullet_limit:
    ninth-wave: [0, 1, 2, 3] # bank: daily scan (4), review detail (5), fs-match memo (6), Compass paper (7), bank-API tooling (8), aws-circuits (9)
    nybss-swe: [0, 2] # bullet 1 (backend APIs) stays in the bank
    deployed-learning: [0, 1, 2] # bullet 3 (teacher averaging) stays in the bank
    jspace-hrm: [0, 1] # bullet 2 (49-claim ledger) stays in the bank
    dj-copilot: [0, 1] # bullet 2 (overall recall and the DJ-affinity feature) stays in the bank
