      - "Now studying when a deployed language model should learn a new fact in its weights and when it should just look the fact up. Experiments on Pythia-410M and 1B with synthetic and real facts; not published."
      # 1 C14 (retrieval matches or beats weights on recall) + C17 (break-even Q* about 2,400
      #   queries per fact at 410M by FLOPs, 1,300 at 1B).
      - "Found that looking facts up was as accurate as weight updates or better on every test, then priced the tradeoff: on Pythia-410M, learning a fact only saves compute once it has been asked about roughly 2,400 times."
      # 2 C11: lexical gate, recall 1.000, false fires 0.000, off-format drift zero by construction.
      - "Built a gate that turns the update on only when a prompt names a learned entity, leaving all other text as it was."
      # 3 C19: one rank-4 adapter per entity, 40 facts over 8 rounds at 1.00/1.00 with no rehearsal;
