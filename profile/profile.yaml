    abstract: "The sentence-level highlight extractor at the heart of my Lehigh capstone search engine. Given a query and a matched sentence, surface the minimal sub-span that explains the match. Deceptively non-trivial when the query is multi-word, partially stop-worded, or syntactically interleaved with the matched sentence."
    on_resume: false

# Resume layout. Sections render in order; each lists experience ids in order.
