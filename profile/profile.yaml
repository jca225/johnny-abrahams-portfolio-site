      summary: "Sensors track how a room's crowd moves; a GRU picks the next song and a reinforcement learning head adjusts to the crowd. With Chris Spletzer."
      tags: "Fall 2025. UPenn ESE 5190. Embedded + ML."
      blurb: "ESP32 sensor packs and a thermal camera measure sound, room conditions, and crowd movement and feed a Raspberry Pi. A 1.8M-parameter GRU trained on about 3,000 scraped tracklists predicts the next song, and a small reinforcement learning head adjusts each pick to how the crowd moves. Built with Chris Spletzer."
    - id: ninth-wave
      title: "Ninth Wave: Software Engineer Intern"
      tags: "Summer 2026. Open-finance fintech. AWS CDK, MCP, Spring Boot."
      blurb: "Built a generator that sets up a new bank's AWS infrastructure from one short YAML file, replacing about ten hand edits per bank. Built Studio, an MCP gateway that gives AI tools one way into the company's internal apps under one set of access rules, and rewrote it in TypeScript after security review. Shipped eleven changes to the Spring Boot portal banks log into, and built the pipelines behind self-updating documentation."
    - id: nybss-swe
      page: /projects/therapy-chatbot
      title: "Clinical Therapy Chatbot"
      tags: "May 2025 to Mar 2026. Part-time, team of three. LLaMA, FastAPI."
      blurb: "A therapy chatbot prototype built at New York Brain & Spine Surgery: clinical rules steer each conversation, and the model writes the replies. One system covers several conditions. The practice later canceled the project."
    - id: compute-cluster
      title: "Home Compute Cluster"
      tags: "Aug 2026. K3s, Raspberry Pi, SOPS, Grafana."
      blurb: "A mixed-architecture K3s cluster (two Raspberry Pi 4s, an Ubuntu iMac control plane, a Lima VM on an Intel MacBook) with encrypted secrets, tested snapshot restores, and monitoring over Tailscale. It runs long unattended jobs so the laptop does not have to."
    - id: gpubox
      page: /projects/gpubox
      title: "gpubox: renting marketplace GPUs without leaking money"
      tags: "Jul 2026 to present. Python, Vast.ai, S3. 791 rentals measured."
      blurb: "A small control plane for renting GPU boxes on the Vast.ai marketplace for unattended multi-hour training: race several offers, health-probe each on real hardware before trusting it, run the job detached, sync checkpoints to S3, and destroy the box at a deadline that survives the laptop closing. The event log of 791 create calls and 360 probe verdicts over two months shows where rentals actually fail: 34% of creates, 29% of probes on SSH, and only 4% on genuinely bad hosts."
    - id: quant-game
      page: /projects/quant-game
      title: "The Quant Game"
      tags: "2024. Co-founded. React + Python + AWS."
      blurb: "A full-stack options-trading sim with 61M financial data points on AWS. Users build and backtest strategies and watch them play out against historical market data."
    - id: capstone
      page: /projects/capstone-search
      title: "Dropbox Document Search Engine"
      tags: "2024. Capstone. NLP + AWS."
      blurb: "A search engine for ~23,000 Dropbox documents, with sentence-level highlight extraction. Partitioned indexing + Dropbox API integration for real-time access. Lehigh capstone for an early-stage startup."

publications:
  - id: kronos-paper
    title: "Kronos: The Architecture of a Multi-Tenant WebAssembly Runtime"
    year: 2026
    with: "paper"
    meta: "2026. Paper, 12 pp. Unpublished."
    pdf: /papers/kronos.pdf
    page: /projects/kronos
    abstract: "The architecture of a multi-tenant WebAssembly runtime that checks each module's imports against its tenant's file and network capabilities before instantiation and bounds every call with fuel and a wall-clock deadline. The paper covers the runtime, capability model, resource control, parallel execution, and control plane, analyzes which isolation properties the code enforced, and measures about 0.15 MiB of memory per added isolate."
    on_resume: true
    home: true
  # Added 2026-09-22. Source: Archive/stale/jspace-hrm/docs (Sep 2026).
  - id: reasoning-graft
    title: "A Recurrent Reasoning Graft in a Frozen Language Model's Global Workspace"
    short_title: "A Recurrent Reasoning Graft in a Frozen Language Model"
    year: 2026
    with: "unpublished"
    meta: "2026. Paper, 12 pp. Unpublished; available on request."
    page: /projects/research
    abstract: "Grafts a small recurrent module with learned halting into the band of the residual stream that multi-step reasoning passes through in a frozen language model, training only the graft (about 5% of the parameters). The graft takes frozen Pythia-1B from near 0% to 54% on eight-hop questions and 61% on unseen entities, and reaches 96% on Qwen2.5-Coder-7B. Also reports four measurement pitfalls for anyone training a module inside a frozen transformer."
    on_resume: true
    home: true
