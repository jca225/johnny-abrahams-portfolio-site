    nybss-research: [0] # bullets 1-2 are experimental work not in the paper
    kronos: [0, 1, 2, 3] # product, traction (added 2026-09-22), runtime, paper
    deployed-learning: [10, 11, 0, 1] # 2026-09-22: honest graft pair (10, 11) replaces 8, 9; gate (2) to bank for space; graft bullets first (8, 9), then continual learning; bullet 3 (one seed) and bullets 4-7 (caveated by C12) stay in the bank
